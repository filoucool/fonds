<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Fonds</title>
    <script>
      (function () {
        var allowed = ['reading-room', 'noctua', 'card-catalog', 'green-shade', 'morocco', 'blue-buckram'];
        var id = 'reading-room';
        try {
          var stored = localStorage.getItem('fonds.theme');
          if (stored && allowed.indexOf(stored) !== -1) id = stored;
        } catch (error) {}
        document.documentElement.setAttribute('data-theme', id);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Fonds needs JavaScript to operate the console.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
