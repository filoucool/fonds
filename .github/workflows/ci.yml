name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        run: pnpm typecheck && pnpm test
      - name: Build the web UI
        run: pnpm --filter @repo-archive/web build
      - name: Dependency inventory
        run: pnpm inventory

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t archiver:ci .
      - name: Record the image digest
        run: sh scripts/record-image-digest.sh archiver:ci
      - name: Keep the recorded inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-inventory
          path: docs/dependency-inventory.json
