name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          short="${GITHUB_SHA::7}"
          echo "short_sha=${short}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/filoucool/fonds:v${version}" >> "$GITHUB_OUTPUT"

      - name: Guard duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Git tag $TAG already exists. Bump package.json version on develop before merging to master."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists. Bump package.json version on develop before merging to master."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Build application
        run: pnpm build

      - name: Write dependency inventory
        run: pnpm inventory

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/filoucool/fonds:${{ steps.meta.outputs.tag }}
            ghcr.io/filoucool/fonds:latest
            ghcr.io/filoucool/fonds:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Record image in inventory
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: sh scripts/record-image-digest.sh "$IMAGE"

      - name: Write release manifest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module -e "
          import { writeFileSync } from 'node:fs';
          const manifest = {
            version: process.env.VERSION,
            tag: process.env.TAG,
            commit: process.env.GITHUB_SHA,
            shortCommit: process.env.SHORT_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            sourceArchive: \`https://github.com/\${process.env.GITHUB_REPOSITORY}/archive/refs/tags/\${process.env.TAG}.zip\`,
            containerImages: [
              {
                reference: process.env.IMAGE,
                digest: process.env.DIGEST,
                pull: \`docker pull \${process.env.IMAGE}\`,
              },
              {
                reference: 'ghcr.io/filoucool/fonds:latest',
                pull: 'docker pull ghcr.io/filoucool/fonds:latest',
              },
              {
                reference: \`ghcr.io/filoucool/fonds:sha-\${process.env.SHORT_SHA}\`,
                pull: \`docker pull ghcr.io/filoucool/fonds:sha-\${process.env.SHORT_SHA}\`,
              },
            ],
            packageUrl: 'https://github.com/filoucool/archiver/pkgs/container/fonds',
          };
          writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          REPO: ${{ github.repository }}
        run: |
          notes="$(cat <<EOF
          ## Source
          - Snapshot: [\`${TAG}\`](https://github.com/${REPO}/archive/refs/tags/${TAG}.zip) (GitHub also attaches zip/tarball on this release)
          - Commit: \`${GITHUB_SHA}\`

          ## Container image (GHCR)
          - \`${IMAGE}\`
          - Digest: \`${DIGEST}\`
          - Also tagged: \`latest\`, \`sha-${SHORT_SHA}\`
          - Package: https://github.com/filoucool/archiver/pkgs/container/fonds

          \`\`\`sh
          docker pull ${IMAGE}
          \`\`\`

          ## Attachments
          - \`dependency-inventory.json\` — runtime dependency inventory for this tag
          - \`release-manifest.json\` — version, commit, image refs, and source archive URL
          EOF
          )"
          gh release create "$TAG" \
            --title "v${VERSION}" \
            --notes "$notes" \
            --generate-notes
          gh release upload "$TAG" \
            docs/dependency-inventory.json \
            release-manifest.json
